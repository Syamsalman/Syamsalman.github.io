<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Section Form Pembelian - Aspal</title>
    <!-- Dependencies: jsPDF & html2canvas (used to generate PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <section
      class="ahp-section"
      id="ahp-form-section"
      data-owner-whatsapp="6285221710616"
    >
      <div class="ahp-title">Form Pembelian Jasa Kontruksi</div>

      <div class="ahp-row">
        <div class="ahp-col">
          <div class="ahp-field">
            <label>Nama Pribadi / PT</label>
            <input
              type="text"
              class="ahp-input-name"
              placeholder="Contoh: PT. Contoh Jaya"
            />
          </div>
        </div>

        <div class="ahp-col">
          <div class="ahp-field">
            <label>Alamat</label>
            <input
              type="text"
              class="ahp-input-address"
              placeholder="Alamat lengkap"
            />
          </div>
        </div>

        <div class="ahp-col">
          <div class="ahp-field">
            <label>Gmail</label>
            <input
              type="email"
              class="ahp-input-email"
              placeholder="email@contoh.com"
            />
          </div>
        </div>
      </div>

      <div style="margin-top: 6px">
        <label style="display: block; font-size: 13px; margin-bottom: 8px"
          >Jenis Kontruksi</label
        >
        <div class="ahp-type-options">
          <button class="ahp-type-btn" data-type="hotmix">
            1. Jasa Aspal Hotmix
          </button>
          <button class="ahp-type-btn" data-type="paving">
            2. Paving Blok
          </button>
          <button class="ahp-type-btn" data-type="cor">
            3. Cor Beton Riggid
          </button>
        </div>
      </div>

      <div class="ahp-items" id="ahp-items-area" aria-live="polite">
        <div class="ahp-small">
          Pilih jenis kontruksi terlebih dahulu untuk melihat item terkait.
        </div>
      </div>

      <div
        style="
          margin-top: 12px;
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
          align-items: center;
        "
      >
        <div style="min-width: 180px">
          <div class="ahp-field">
            <label>Panjang (meter)</label>
            <input
              type="number"
              min="0"
              step="0.01"
              class="ahp-input-length"
              value="0"
            />
          </div>
        </div>
        <div style="min-width: 180px">
          <div class="ahp-field">
            <label>Lebar (meter)</label>
            <input
              type="number"
              min="0"
              step="0.01"
              class="ahp-input-width"
              value="0"
            />
          </div>
        </div>
        <div style="min-width: 180px">
          <div class="ahp-field">
            <label>Luas (m²)</label>
            <input type="number" readonly class="ahp-input-area" value="0" />
          </div>
        </div>
      </div>

      <div class="ahp-total" id="ahp-total-display">Total Harga: Rp 0</div>

      <div class="ahp-foot col-lg-4">
        <button class="ahp-btn ahp-btn-primary" id="ahp-generate">
          Kirim
        </button>
        <button class="ahp-btn ahp-btn-ghost" id="ahp-reset">Reset</button>
        <button class="ahp-btn ahp-btn-ghost">
          <a href="layanan.html">Kembali</a>
        </button>
        </div>
        <div style="margin-left: auto" class="ahp-note">
          <div style="font-style: italic; color: #6b0f0f;" class="ahp-note">Note:  Bisa chat WhatApps untuk negosisasi Harga</div>
        </div>
      </div>
    </section>

    <script>
      (function () {
        // Data harga per meter untuk setiap jenis (ubah sesuai kebutuhan)
        const PRICE_LIST = {
          hotmix: [
            {
              id: "HM1",
              name: "Lapis aspal hotmix gelaran 2 cm kerusakan minor",
              price: 70000,
            },
            {
              id: "HM2",
              name: "Lapis aspal hotmix gelaran 2 cm leveling 50 %",
              price: 90000,
            },
            {
              id: "HM3",
              name: "Lapis aspal hotmix gelaran 2 cm leveling 100 %",
              price: 110000,
            },
            {
              id: "HM4",
              name: " Lapis aspal hotmix gelaran 2 cmLPB base corse 10 cm, split 5 cm aspal bakar",
              price: 150000,
            },
          ],
          paving: [
            {
              id: "PV1",
              name: "Perapihan lahan, abu batu 5 cm, paving block 6 cm, setara  k-300",
              price: 130000,
            },
            {
              id: "PV2",
              name: "Perapihan lahan, abu batu 5 cm, paving block 8 cm, setara  k-300",
              price: 160000,
            },
            {
              id: "PV3",
              name: "Perapihan lahan, abu batu 5 cm, LPB base corse 10 cm, split 5 cm paving block 6 cm, setara  k-300",
              price: 170000,
            },
            {
              id: "PV4",
              name: "Perapihan lahan, abu batu 5 cm,LPB base corse 10 cm, split 5 cm paving block 8 cm, setara  k-300",
              price: 210000,
            },
          ],
          cor: [
            {
              id: "CR1",
              name: "Perapihan lahan, plastik sheet, wiremesh M6, 20cm beton K 250, finising riggid",
              price: 120000,
            },
            {
              id: "CR2",
              name: "Perapihan lahan, plastik sheet, LPB base corse 10 cm, split 5 cm, wiremesh M6, 20cm beton K 250, finising riggid",
              price: 160000,
            },
          ],
        };

        // DOM
        const section = document.getElementById("ahp-form-section");
        const ownerWhats = section.dataset.ownerWhatsapp || "";
        const typeButtons = Array.from(
          document.querySelectorAll(".ahp-type-btn")
        );
        const itemsArea = document.getElementById("ahp-items-area");
        const lengthInput = document.querySelector(".ahp-input-length");
        const widthInput = document.querySelector(".ahp-input-width");
        const areaInput = document.querySelector(".ahp-input-area");
        const totalDisplay = document.getElementById("ahp-total-display");
        const btnGenerate = document.getElementById("ahp-generate");
        const btnReset = document.getElementById("ahp-reset");
        const nameInput = document.querySelector(".ahp-input-name");
        const addressInput = document.querySelector(".ahp-input-address");
        const emailInput = document.querySelector(".ahp-input-email");

        let selectedType = null;
        let selectedItemId = null;

        function formatRp(n) {
          return "Rp " + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function renderItems(type) {
          selectedType = type;
          selectedItemId = null;
          const items = PRICE_LIST[type];
          if (!items) {
            itemsArea.innerHTML =
              '<div class="ahp-small">Tidak ada item untuk pilihan ini.</div>';
            recalcTotal();
            return;
          }
          let html =
            '<div class="ahp-small">Pilih item (masing-masing kontruksi punya 4 item). Harga per meter ditampilkan di samping.</div>';
          html += '<div style="margin-top:8px">';
          items.forEach((it) => {
            html += `
            <div class="ahp-item">
              <div style="display:flex;gap:12px;align-items:center">
                <input type="radio" name="ahp-item" id="ahp-item-${
                  it.id
                }" value="${it.id}">
                <label for="ahp-item-${it.id}">${it.name}</label>
              </div>
              <div style="font-size:14px">${formatRp(it.price)}/m²</div>
            </div>
          `;
          });
          html += "</div>";
          itemsArea.innerHTML = html;
          // attach listeners
          Array.from(
            itemsArea.querySelectorAll('input[name="ahp-item"]')
          ).forEach((r) => {
            r.addEventListener("change", () => {
              selectedItemId = r.value;
              recalcTotal();
            });
          });
          recalcTotal();
        }

        function recalcTotal() {
          const L = parseFloat(lengthInput.value) || 0;
          const W = parseFloat(widthInput.value) || 0;
          const area = Math.round((L * W + Number.EPSILON) * 100) / 100;
          areaInput.value = area;

          let unitPrice = 0;
          if (selectedType && selectedItemId) {
            const item = PRICE_LIST[selectedType].find(
              (i) => i.id === selectedItemId
            );
            unitPrice = item ? item.price : 0;
          }
          const total = Math.round(area * unitPrice || 0);
          totalDisplay.textContent = "Total Harga: " + formatRp(total);
          return { area, unitPrice, total };
        }

        // type button handlers
        typeButtons.forEach((b) => {
          b.addEventListener("click", () => {
            typeButtons.forEach((x) => x.classList.remove("ahp-active"));
            b.classList.add("ahp-active");
            renderItems(b.dataset.type);
          });
        });

        // inputs change
        [lengthInput, widthInput].forEach((inp) =>
          inp.addEventListener("input", recalcTotal)
        );

        // generate PDF
        btnGenerate.addEventListener("click", async function () {
          // gather data
          const name = nameInput.value || "-";
          const address = addressInput.value || "-";
          const email = emailInput.value || "-";
          const { area, unitPrice, total } = recalcTotal();
          if (!selectedType) {
            alert("Pilih jenis kontruksi terlebih dahulu.");
            return;
          }
          if (!selectedItemId) {
            alert("Pilih salah satu item pada kontruksi.");
            return;
          }
          if (area <= 0) {
            alert("Masukkan ukuran panjang & lebar yang valid.");
            return;
          }

          const item = PRICE_LIST[selectedType].find(
            (i) => i.id === selectedItemId
          );
          const now = new Date();
          const summaryHtml = `
          <div style="font-family:Arial,sans-serif;padding:18px;max-width:740px">
            <h2>Ringkasan Pemesanan</h2>
            <p><strong>Nama / PT:</strong> ${escapeHtml(name)}</p>
            <p><strong>Alamat:</strong> ${escapeHtml(address)}</p>
            <p><strong>Gmail:</strong> ${escapeHtml(email)}</p>
            <p><strong>Jenis Kontruksi:</strong> ${escapeHtml(selectedType)}</p>
            <p><strong>Item:</strong> ${escapeHtml(item.name)}</p>
            <p><strong>Luas:</strong> ${area} m²</p>
            <p><strong>Harga per m²:</strong> ${formatRp(unitPrice)}</p>
            <h3>Total: ${formatRp(total)}</h3>
            <p style="font-size:12px;color:#666">Tanggal: ${now.toLocaleString(
              "id-ID"
            )}</p>
          </div>
        `;

          // render to canvas then to PDF
          const wrapper = document.createElement("div");
          wrapper.style.padding = "12px";
          wrapper.innerHTML = summaryHtml;
          document.body.appendChild(wrapper);
          try {
            const canvas = await html2canvas(wrapper, { scale: 2 });
            const imgData = canvas.toDataURL("image/png");
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
              unit: "px",
              format: [canvas.width, canvas.height],
            });
            pdf.addImage(imgData, "PNG", 0, 0, canvas.width, canvas.height);
            const filename = `pemesanan_${Date.now()}.pdf`;
            pdf.save(filename);

            // Build WhatsApp message
            const owner = (
              section.dataset.ownerWhatsapp ||
              ownerWhats ||
              ""
            ).replace(/[^0-9+]/g, "");
            const msgLines = [];
            msgLines.push("Ada pemesanan baru dari web:");
            msgLines.push("Nama: " + name);
            msgLines.push("Alamat: " + address);
            msgLines.push("Gmail: " + email);
            msgLines.push(
              "Jenis Kontruksi: " + selectedType + " - " + item.name
            );
            msgLines.push("Luas: " + area + " m²");
            msgLines.push("Total: " + formatRp(total));
            msgLines.push("PDF telah di-download pada perangkat pengirim.");

            const text = encodeURIComponent(msgLines.join("\n"));

            if (owner) {
              // open WhatsApp chat in new tab with prefilled message
              const waUrl = `https://wa.me/${owner}?text=${text}`;
              window.open(waUrl, "_blank");
            } else {
              alert(
                "Nomor WhatsApp owner belum di-set. Silakan atur atribut data-owner-whatsapp pada section."
              );
            }
          } catch (err) {
            console.error(err);
            alert("Gagal membuat PDF: " + err.message);
          } finally {
            wrapper.remove();
          }
        });

        btnReset.addEventListener("click", function () {
          nameInput.value = "";
          addressInput.value = "";
          emailInput.value = "";
          lengthInput.value = "0";
          widthInput.value = "0";
          areaInput.value = "0";
          totalDisplay.textContent = "Total Harga: Rp 0";
          selectedType = null;
          selectedItemId = null;
          typeButtons.forEach((x) => x.classList.remove("ahp-active"));
          itemsArea.innerHTML =
            '<div class="ahp-small">Pilih jenis kontruksi terlebih dahulu untuk melihat item terkait.</div>';
        });

        function escapeHtml(s) {
          return String(s).replace(/[&<>\"']/g, function (c) {
            return {
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[c];
          });
        }
      })();
    </script>
  </body>
</html>
