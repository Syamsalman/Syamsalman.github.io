<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D WEBSITE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body>
    <!-- intro -->
    <img class="image-gradient" src="img/gradient.png" alt="">
    <div class="layer-blur"></div>
    <!-- Main -->
    <div class="container">
        <header>
            <h1 class="logo" data-aos="fade-down" data-aos-duration="1500" >XINN</h1>
            <nav>
                <a data-aos="fade-down" data-aos-duration="1000" href="">HOME</a>
                <a data-aos="fade-down" data-aos-duration="1500" href="">COMPANY</a>
                <a data-aos="fade-down" data-aos-duration="2000" href="">FEATURE</a>
                <a data-aos="fade-down" data-aos-duration="2500" href="">DOCS</a>
            </nav>
            <button data-aos="fade-down" data-aos-duration="3000" class="btn-signing">JOIN US</button>
        </header>
        <main>
            <div class="content">
                <div class="tag-box">
                    <div data-aos="fade-zoom-in"
                    data-aos-easing="ease-in-back"
                    data-aos-delay="300"
                    data-aos-offset="0" data-aos-duration="3500" class="tag">INRODUCTION &wedbar;</div>
                </div>
                <h1 data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-delay="300"
                data-aos-offset="0" data-aos-duration="4000">XINN FOR <br>DEVELOPERS</h1>
                <p data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-offset="0" data-aos-duration="4500" class="description">
                    I’m a passionate web developer who builds fast,responsive, and user-friendly websites.
                </p>
                <div data-aos="fade-zoom-in"
                data-aos-easing="ease-in-back"
                data-aos-offset="0" data-aos-duration="5000" class="buttons">
                    <a href="#" class="btn-get-started">Documentation&gt;</a>
                    <a href="#" class="btn-signing-main">Getstarted&gt;</a>
                </div>
            </div>
            <spline-viewer data-aos="zoom-in" data-aos-duration="2500" class="robot-3d" url="https://prod.spline.design/lDE3hN-aSnr9zE5N/scene.splinecode"></spline-viewer>
        </main>
    </div>
</body>
<script type="module" src="https://unpkg.com/@splinetool/viewer@1.10.24/build/spline-viewer.js"></script>
<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>
  AOS.init();
</script>
</html>
